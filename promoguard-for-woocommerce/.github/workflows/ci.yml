name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        working-directory: promoguard-for-woocommerce
        run: composer install --no-interaction --prefer-dist
      - name: Run PHP checks
        working-directory: promoguard-for-woocommerce
        run: composer check

  assets:
    name: JavaScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promoguard-for-woocommerce/package-lock.json
      - name: Install npm dependencies
        working-directory: promoguard-for-woocommerce
        run: npm ci
      - name: Run JavaScript checks
        working-directory: promoguard-for-woocommerce
        run: npm run check
